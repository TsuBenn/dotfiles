[language-server.godot]
command = "nc"
args = ["127.0.0.1", "6005"]

[[language]]
name = "gdscript"
scope = "source.gdscript"
file-types = ["gd"]
roots = ["project.godot"]
language-servers = ["godot"]
formatter = { command = "gdformat", args = ["-"] }
auto-format = true

[[language]]
name = "java"
indent = { tab-width = 4, unit = "    "}
roots = ["nbproject", "build.xml", ".classpath", ".project", ".git"]

[[language]]
name = "rust"
auto-format = false

[[language]]
name = "c"
indent = { tab-width = 4, unit = "    "}
