unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -sg escape-time 10

bind -n C-S-l next-window
bind -n C-S-j previous-window
bind -n C-S-n new-window
bind -n C-S-q kill-pane
bind -n C-S-d detach-client

bind n new-window
bind q kill-pane
bind j previous-window
bind l next-window
bind d detach-client

bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind -n C-S-a resize-pane -Z
bind -n C-S-w choose-session

set -g base-index 1
set -g pane-base-index 1
set -g allow-passthrough on

set -g window-status-separator ""

set -s extended-keys on
set -as terminal-features 'ghostty:extkeys'

run-shell "~/.tmux/theme.sh"
