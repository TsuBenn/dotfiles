]
answer = "The average number of items in a queuing system equals arrival rate times average time in system"
explanations = [
    "Little's Law: L = λ × W, where L is average number of items in the system, λ is average arrival rate, and W is average time an item spends in the system.",
    "",
    "",
    "",
]

