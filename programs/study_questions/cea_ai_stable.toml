[[questions]]
question = "What is the primary difference between computer architecture and computer organization?"
choices = [
    "Architecture is visible to the programmer, organization is how features are implemented",
    "Organization is visible to the programmer, architecture is how features are implemented",
    "They are exactly the same concept",
    "Architecture deals with hardware, organization deals with software",
]
answer = "Architecture is visible to the programmer, organization is how features are implemented"
explanations = [
    "Computer architecture refers to those attributes visible to the programmer (instruction set, data types, I/O mechanisms), while computer organization refers to how these features are implemented (control signals, memory technology).",
    "",
    "",
    "",
]

