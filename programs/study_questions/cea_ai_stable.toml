[[questions]]
question = "According to Amdahl's Law, what limits the potential speedup of a program using multiple processors?"
choices = [
    "The number of processors available",
    "The speed of individual processors",
    "The fraction of the program that cannot be parallelized",
    "The size of the program",
]
answer = "The fraction of the program that cannot be parallelized"
explanations = [
    "",
    "",
    "Amdahl's Law states that the speedup is limited by the portion of the program that must execute sequentially. Even with infinite processors, speedup is bounded by 1/(1-P) where P is the parallelizable fraction.",
    "",
]

[[questions]]
question = "What is the formula for Amdahl's Law speedup?"
choices = [
    "Speedup = 1 / (1 - P + P/N)",
    "Speedup = P × N",
    "Speedup = N / (1 - P)",
    "Speedup = 1 / P",
]
answer = "Speedup = 1 / (1 - P + P/N)"
explanations = [
    "Amdahl's Law: Speedup = 1 / [(1 - P) + P/N] where P is the parallelizable portion and N is the number of processors. The sequential portion (1-P) always remains.",
    "",
    "",
    "",
]

