[[questions]]
question = "What is cache coherence?"
choices = [
    "Caches having same data",
    "Ensuring multiple caches have consistent copies of shared data",
    "Cache synchronization",
    "Cache sharing",
]
answer = "Ensuring multiple caches have consistent copies of shared data"
explanations = [
    "",
    "Cache coherence ensures that when one processor updates data in its cache, other caches containing the same data are updated or invalidated to maintain consistency.",
    "",
    "",
]

[[questions]]
question = "What are the two categories of hardware cache coherence protocols?"
choices = [
    "MESI and MOESI",
    "Directory protocols and snoopy protocols",
    "Write-through and write-back",
    "Inclusive and exclusive",
]
answer = "Directory protocols and snoopy protocols"
explanations = [
    "",
    "Hardware cache coherence solutions are divided into directory protocols (centralized directory tracking) and snoopy protocols (broadcast-based).",
    "",
    "",
]

[[questions]]
question = "What is the MESI protocol?"
choices = [
    "Memory protocol",
    "Cache coherence protocol with states: Modified, Exclusive, Shared, Invalid",
    "Multiprocessor protocol",
    "Bus arbitration protocol",
]
answer = "Cache coherence protocol with states: Modified, Exclusive, Shared, Invalid"
explanations = [
    "",
    "MESI is a snoopy cache coherence protocol using four states per cache line: Modified, Exclusive, Shared, Invalid to track cache line status.",
    "",
    "",
]

[[questions]]
question = "In MESI protocol, what does the \"Modified\" state indicate?"
choices = [
    "Line is same as memory, may be in other caches",
    "Line has been modified and is only in this cache (dirty)",
    "Line is invalid",
    "Line is exclusive to this cache",
]
answer = "Line has been modified and is only in this cache (dirty)"
explanations = [
    "",
    "Modified means the cache line has been modified and is present only in this cache; main memory copy is stale (dirty).",
    "",
    "",
]

[[questions]]
question = "In MESI protocol, what does the \"Exclusive\" state indicate?"
choices = [
    "Line is modified",
    "Line matches main memory and is only in this cache",
    "Line may be in other caches",
    "Line is invalid",
]
answer = "Line matches main memory and is only in this cache"
explanations = [
    "",
    "Exclusive means the cache line matches main memory and is present only in this cache; no other caches have a copy (clean, exclusive).",
    "",
    "",
]

[[questions]]
question = "In MESI protocol, what does the \"Shared\" state indicate?"
choices = [
    "Line is modified",
    "Line matches main memory and may be in other caches",
    "Line is exclusive",
    "Line is invalid",
]
answer = "Line matches main memory and may be in other caches"
explanations = [
    "",
    "Shared means the cache line matches main memory and may be present in multiple caches; all copies are consistent with main memory.",
    "",
    "",
]

