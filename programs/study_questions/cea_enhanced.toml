[[questions]]
question = "The instruction, which adds 1 to the value in a memory location, has five stages: fetch opcode (four cycles), fetch operand address (three cycles), fetch operand (three cycles), add 1 to operand (three cycles), and store operand (three cycles). An interrupt sends request at beginning of fetch operand stage. How many cycles does the processor enter the interrupt processing cycle?"
choices = ["6", "7", "8", "9", "10"]
answer = "9"
explanations = [
    "Incorrect. Let's sum: fetch opcode (4) + fetch operand address (3) = 7 cycles before interrupt occurs at beginning of fetch operand stage. The interrupt is recognized at instruction boundary, so it would finish current instruction? Actually, interrupts are checked between stages. Need careful analysis.",
]

[[questions]]
question = "The instruction, which adds 1 to the value in a memory location, has five stages: fetch opcode (2 bus cycles), fetch operand address (2 bus cycles), fetch operand (2 bus cycles), add 1 to operand (1 bus cycle), and store operand (3 bus cycles). An interrupt sends request at beginning of fetch operand address stage. How many cycles does the processor enter the interrupt processing cycle?"
choices = ["6", "7", "8", "9", "5"]
answer = "8"
explanations = [
    "Incorrect. Interrupt at beginning of fetch operand address stage means fetch opcode (2 cycles) completed. Interrupt is recognized after completing the current instruction? Actually, interrupts are checked at instruction boundaries, so the instruction must complete: fetch operand address (2) + fetch operand (2) + add (1) + store (3) = 8 more cycles after the interrupt request? Total before interrupt handling = 2 (already done) + 8 = 10?",
]

