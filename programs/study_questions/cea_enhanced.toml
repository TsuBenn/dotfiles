[[questions]]
question = "What type of instruction is used for converting data formats?"
choices = ["Transfer", "Arithmetic", "Control", "Conversion"]
answer = "Conversion"
explanations = [
    "Incorrect. Transfer instructions move data.",
    "Incorrect. Arithmetic instructions perform calculations.",
