    "Correct. L1 cache is almost always private (not shared) per core, split into instruction and data caches.",
]

[[questions]]
question = "Which is the correct choice for the description: \"A single machine instruction controls the simultaneous execution of a number of processing elements such as vector and array processors\"?"
choices = ["Single instruction, single data (SISD)", "Single instruction, multiple data (SIMD)", "Multiple instruction, single data (MISD)", "Multiple instruction, multiple data (MIMD)"]
answer = "Single instruction, multiple data (SIMD)"
explanations = [
    "Incorrect. SISD is a uniprocessor.",
    "Correct. SIMD executes one instruction on multiple data elements simultaneously (vector/array processors).",
    "Incorrect. MISD is not commercially implemented.",
    "Incorrect. MIMD has multiple instruction streams.",
]

[[questions]]
question = "Which computing model is characterized by a large number of processors working on different parts of a problem simultaneously?"
choices = ["Single instruction, single data (SISD)", "Single instruction, multiple data (SIMD)", "Multiple instruction, multiple data (MIMD)", "Multiple instruction, single data (MISD)"]
answer = "Multiple instruction, multiple data (MIMD)"
explanations = [
    "Incorrect. SISD has one processor.",
    "Incorrect. SIMD executes same instruction on different data.",
    "Correct. MIMD has multiple processors each executing different instructions on different data (SMPs, clusters).",
    "Incorrect. MISD is not a practical model.",
]

[[questions]]
question = "Which of the following component does not belong to central processing unit?"
choices = ["System interconnection", "Arithmetic and logic unit", "Registers", "Control unit", "CPU interconnection"]
