[[questions]]
question = "How many check bits are needed if the Hamming error correction code is used to detect single bit error in a 128-bit data word?"
choices = ["6 bits", "7 bits", "8 bits", "9 bits", "5 bits"]
answer = "8 bits"
explanations = [
    "Incorrect. With 6 check bits, 2^6 = 64, which is less than 128 + 6 + 1 = 135. The condition 2^k >= n + k + 1 fails.",
    "Incorrect. 2^7 = 128, which is less than 128 + 7 + 1 = 136. The inequality is not satisfied.",
    "Correct. For n = 128 bits, we need k check bits such that 2^k >= n + k + 1. 2^8 = 256 >= 128 + 8 + 1 = 137. Thus, 8 check bits are needed.",
    "Incorrect. 2^9 = 512, which satisfies the condition but uses more bits than necessary. 8 bits are sufficient.",
    "Incorrect. 2^5 = 32, far less than 128 + 5 + 1 = 134.",
]

