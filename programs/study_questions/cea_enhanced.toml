explanations = [
    "Incorrect. 1 KByte = 8192 bits. 2^11 = 2048, far less than 8192 + 11 + 1 = 8204.",
    "Incorrect. 2^12 = 4096, still less than 8192 + 12 + 1 = 8205.",
    "Incorrect. 2^13 = 8192, which is less than 8192 + 13 + 1 = 8206.",
    "Correct. For n = 8192 bits, 2^14 = 16384 >= 8192 + 14 + 1 = 8207. So 14 check bits are needed.",
    "Incorrect. 2^15 = 32768 satisfies the condition but uses one more bit than necessary.",
]

