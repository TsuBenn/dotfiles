    "Incorrect. I/O interrupts come from peripheral devices.",
    "Incorrect. Hardware failure interrupts indicate physical problems.",
]

[[questions]]
question = "Which cache is not a shared cache?"
choices = ["L4 cache", "L3 cache", "L2 cache", "L1 cache"]
answer = "L1 cache"
explanations = [
    "Incorrect. L4 cache is typically shared across multiple cores or chips.",
    "Incorrect. L3 cache is typically shared across cores.",
