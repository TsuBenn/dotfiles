[[questions]]
question = "Which of the following correctly describes 'Priority Inversion' in operating system scheduling?"
choices = ["A high-priority process is preempted by a low-priority process", "A low-priority process holds a resource needed by a high-priority process, which is then blocked, allowing medium-priority processes to run", "All processes are assigned the same priority", "The scheduler randomly changes process priorities"]
answer = "A low-priority process holds a resource needed by a high-priority process, which is then blocked, allowing medium-priority processes to run"
explanations = ["Incorrect. High-priority processes preempt low-priority ones, not vice versa.", "Correct. Priority inversion occurs when a high-priority thread is blocked waiting for a resource held by a low-priority thread, and medium-priority threads preempt the low-priority thread, indirectly blocking the high-priority one.", "Incorrect. This is a round-robin or equal priority scenario.", "Incorrect. This is random scheduling, not priority inversion."]

[[questions]]
question = "How does the Windows operating system mitigate the 'Priority Inversion' problem?"
choices = ["By killing the low-priority process", "By temporarily boosting the priority of the low-priority thread holding the resource (Priority Boost/Priority Inheritance)", "By disabling interrupts", "By rebooting the system"]
answer = "By temporarily boosting the priority of the low-priority thread holding the resource (Priority Boost/Priority Inheritance)"
explanations = ["Incorrect. Killing processes is not a standard mitigation strategy.", "Correct. Windows uses priority inheritance (or priority boosting) to temporarily elevate the low-priority thread so it can release the resource quickly, unblocking the high-priority thread.", "Incorrect. Disabling interrupts would freeze the system.", "Incorrect. This is highly disruptive and unnecessary."]

[[questions]]
question = "In a system using Inverted Page Tables, what is used as the index key for searching the table?"
choices = ["The virtual page number", "The physical page frame number", "The process ID (PID) combined with the virtual page number", "The memory address offset"]
answer = "The process ID (PID) combined with the virtual page number"
explanations = ["Incorrect. In a standard page table, the virtual page number is the index. In an inverted table, we need to find the physical frame.", "Incorrect. The physical frame is what we are trying to find, so it cannot be the search key.", "Correct. Because multiple processes can have the same virtual address, the search key in an inverted page table is the combination of PID and the virtual page number.", "Incorrect. The offset is not part of the page table lookup index."]

[[questions]]
question = "Which page replacement algorithm uses a circular list and a reference bit, clearing the bit as it scans, and evicting the first page with a 0 bit?"
choices = ["Not Recently Used (NRU)", "Second-Chance", "Clock", "Least Recently Used (LRU)"]
answer = "Clock"
explanations = ["Incorrect. NRU categorizes pages into classes based on R and M bits at the time of a fault.", "Incorrect. Second-chance uses a FIFO list and moves pages to the rear, which is functionally similar but structurally different from the circular list of the Clock algorithm.", "Correct. The Clock algorithm arranges pages in a circular list. The hand scans for a page with R=0, clearing R=1 pages to 0 as it passes. The first 0 page is evicted.", "Incorrect. LRU strictly tracks time of last use, requiring hardware support or complex software aging."]

[[questions]]
question = "What is the primary cause of 'thrashing' in a virtual memory system?"
