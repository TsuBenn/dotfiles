[[questions]]
question = "In the Second-Chance page replacement algorithm, what happens to a page whose Reference (R) bit is set when it reaches the front of the FIFO queue?"
choices = ["It is immediately evicted", "It is given a second chance, its R bit is cleared, and it is moved to the rear of the queue", "It is written back to disk immediately", "It triggers a page fault"]
