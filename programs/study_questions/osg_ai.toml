explanations = ["Incorrect. A deadlock hasn't occurred yet in an unsafe state either.", "Correct. A safe state guarantees that the system can allocate resources to all processes in some order, allowing them to complete without entering a deadlock.", "Incorrect. Resources are usually allocated in a safe state.", "Incorrect. CPU utilization is unrelated to the safe state definition."]

[[questions]]
