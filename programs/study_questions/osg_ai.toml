answer = "The Ostrich Algorithm"
explanations = ["Incorrect. Detection and recovery actively handles deadlocks.", "Incorrect. Dynamic avoidance uses algorithms like Banker's to prevent deadlocks.", "Incorrect. Prevention negates one of the four conditions.", "Correct. The Ostrich Algorithm simply ignores deadlocks, pretending they don't exist, which is actually used in systems like UNIX where deadlocks are rare."]

[[questions]]
