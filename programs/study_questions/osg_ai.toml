version = 5

[[questions]]
question = "Which of the following best describes the 'Top-Down' view of an operating system as a resource manager?"
choices = ["Manage pieces of a complex system", "Provide abstractions to application programs", "Provide orderly, controlled allocation of resources", "Turn ugly hardware into beautiful abstractions"]
answer = "Provide abstractions to application programs"
explanations = ["Correct. The top-down view focuses on providing abstractions to application programs.", "Incorrect. Managing pieces of a complex system is the 'Bottom-Up' view.", "Incorrect. Providing orderly, controlled allocation of resources is the 'Alternative' view.", "Incorrect. Turning ugly hardware into beautiful abstractions describes the OS as an Extended Machine."]

[[questions]]
question = "True or False: The third generation of operating systems (1965-1980) was characterized by vacuum tubes and batch systems."
choices = ["True", "False"]
answer = "False"
explanations = ["Incorrect. The third generation was characterized by ICs and multiprogramming.", "Correct. Vacuum tubes and batch systems characterized the first and second generations, respectively."]

[[questions]]
question = "Which caching system issue determines what to do when a slot is needed and an item must be removed?"
choices = ["When to put a new item into the cache", "Which cache line to put the new item in", "Which item to remove from the cache", "Where to put a newly evicted item in the larger memory"]
answer = "Which item to remove from the cache"
explanations = ["Incorrect. This refers to the timing of insertion.", "Incorrect. This refers to the placement strategy within the cache.", "Correct. Deciding which item to remove (eviction policy) is triggered when a slot is needed.", "Incorrect. This refers to the destination of the evicted item in the memory hierarchy."]

[[questions]]
question = "In a monolithic system structure, what is the role of the 'utility procedures'?"
choices = ["They invoke the requested service procedure", "They carry out the system calls", "They help the service procedures", "They manage the hardware directly"]
answer = "They help the service procedures"
explanations = ["Incorrect. The main program invokes the requested service procedure.", "Incorrect. The service procedures carry out the system calls.", "Correct. Utility procedures exist to assist the service procedures.", "Incorrect. This is not the defined role of utility procedures in this model."]

[[questions]]
question = "Which of the following is NOT one of the four principal events that cause processes to be created?"
choices = ["System initialization", "Execution of a process creation system call", "A fatal error in another process", "Initiation of a batch job"]
answer = "A fatal error in another process"
explanations = ["Incorrect. System initialization is a principal event for process creation.", "Incorrect. A running process executing a creation system call creates a new process.", "Correct. Fatal errors terminate processes; they do not create them.", "Incorrect. Initiation of a batch job creates a process."]

[[questions]]
question = "Which process state transition occurs when a process is temporarily stopped to let another process run?"
choices = ["Running to Blocked", "Blocked to Ready", "Running to Ready", "Ready to Running"]
answer = "Running to Ready"
explanations = ["Incorrect. Running to Blocked occurs when waiting for an external event.", "Incorrect. Blocked to Ready occurs when the external event happens.", "Correct. A running process is moved to the Ready state (preempted) to let another run.", "Incorrect. Ready to Running occurs when the scheduler assigns the CPU."]

[[questions]]
question = "Which of the following items is PRIVATE to each thread in the classical thread model?"
choices = ["Address space", "Open files", "Program counter", "Child processes"]
answer = "Program counter"
explanations = ["Incorrect. The address space is shared among all threads in a process.", "Incorrect. Open files are shared among all threads.", "Correct. Each thread has its own program counter, registers, and stack.", "Incorrect. Child processes are associated with the process as a whole."]

[[questions]]
question = "Which condition for mutual exclusion states that no process running outside its critical region may block other processes?"
choices = ["No two processes may be simultaneously inside their critical regions", "No assumptions may be made about speeds or the number of CPUs", "No process running outside its critical region may block other processes", "No process should have to wait forever to enter its critical region"]
answer = "No process running outside its critical region may block other processes"
explanations = ["Incorrect. This is the mutual exclusion condition.", "Incorrect. This is the hardware independence condition.", "Correct. This ensures processes outside the critical region do not interfere with those trying to enter.", "Incorrect. This is the bounded waiting (progress) condition."]

[[questions]]
question = "True or False: Peterson's Solution is a mutual exclusion algorithm that relies on busy waiting."
choices = ["True", "False"]
answer = "True"
explanations = ["Correct. Peterson's solution uses variables and a while loop that continuously checks conditions (busy waiting) to achieve mutual exclusion.", "Incorrect. Peterson's solution does utilize busy waiting."]

[[questions]]
question = "Which scheduling algorithm is specifically designed for interactive systems and assigns processes to lottery tickets?"
choices = ["Shortest Process Next", "Guaranteed Scheduling", "Lottery Scheduling", "Fair-Share Scheduling"]
answer = "Lottery Scheduling"
explanations = ["Incorrect. Shortest Process Next estimates process time.", "Incorrect. Guaranteed Scheduling promises a specific fraction of CPU time.", "Correct. Lottery Scheduling gives processes lottery tickets, and the winner is chosen randomly.", "Incorrect. Fair-Share Scheduling considers user groups rather than individual processes."]

[[questions]]
question = "In the Dining Philosophers problem, what is the primary consequence of having each philosopher pick up their left fork simultaneously?"
choices = ["Deadlock", "Livelock", "Starvation", "Race condition"]
answer = "Deadlock"
explanations = ["Correct. If all pick up the left fork, no one can pick up the right fork, causing a circular wait (deadlock).", "Incorrect. Livelock involves continuous state changes without progress.", "Incorrect. While starvation can occur, the specific simultaneous pickup leads to immediate deadlock.", "Incorrect. A race condition involves timing-dependent shared memory access."]

[[questions]]
question = "According to Parkinson's Law as paraphrased in memory management, what happens to programs?"
choices = ["They shrink to fit the available cache", "They expand to fill the memory available to hold them", "They require virtual memory to execute", "They fragment the disk over time"]
answer = "They expand to fill the memory available to hold them"
explanations = ["Incorrect. Programs do not necessarily shrink.", "Correct. Parkinson's Law implies programs will grow to use all available memory.", "Incorrect. While virtual memory helps, this is not the paraphrased law.", "Incorrect. This refers to fragmentation, not Parkinson's Law."]

[[questions]]
question = "Which memory management algorithm allocates the first hole that is big enough for the process?"
choices = ["Best fit", "Worst fit", "First fit", "Quick fit"]
answer = "First fit"
explanations = ["Incorrect. Best fit searches for the smallest adequate hole.", "Incorrect. Worst fit searches for the largest hole.", "Correct. First fit stops searching at the first hole that satisfies the requirement.", "Incorrect. Quick fit uses separate lists for common sizes."]

[[questions]]
question = "Which page replacement algorithm categorizes pages into classes based on their Referenced (R) and Modified (M) bits, replacing a page from the lowest-numbered non-empty class?"
choices = ["Optimal algorithm", "First-in, First-out (FIFO)", "Not Recently Used (NRU)", "Least Recently Used (LRU)"]
answer = "Not Recently Used (NRU)"
explanations = ["Incorrect. Optimal replaces the page not used for the longest future time.", "Incorrect. FIFO replaces the oldest page regardless of R or M bits.", "Correct. NRU uses the R and M bits to classify pages into 4 classes and removes from the lowest class.", "Incorrect. LRU tracks the exact time of last use, not just R/M bit classes."]

[[questions]]
question = "True or False: In a system with separate Instruction and Data (I and D) spaces, the text segment (instructions) can be shared among multiple processes running the same program."
choices = ["True", "False"]
answer = "True"
explanations = ["Correct. Separate I and D spaces allow the read-only instruction space to be shared while data spaces remain private.", "Incorrect. Separate I and D spaces explicitly allow text sharing."]

[[questions]]
question = "During page fault handling, what occurs immediately after the system discovers which virtual page is needed and verifies the address is valid?"
choices = ["The hardware traps to kernel", "The faulting instruction is backed up", "If the selected frame is dirty, the page is scheduled for transfer to disk", "The operating system schedules a disk operation to bring the needed page in"]
answer = "If the selected frame is dirty, the page is scheduled for transfer to disk"
explanations = ["Incorrect. The trap happens before discovering the virtual page.", "Incorrect. The instruction is backed up after the page arrives.", "Correct. If the frame chosen for eviction is dirty, it must be written to disk before the new page is read in.", "Incorrect. Reading the new page from disk occurs after the dirty page is written out."]

[[questions]]
question = "In the context of file systems, what is the primary advantage of using an i-node over a linked list allocation with a table in memory (FAT)?"
choices = ["I-nodes allow for random access without traversing a list", "I-nodes require less memory than a FAT", "I-nodes prevent external fragmentation", "I-nodes do not require disk space for metadata"]
answer = "I-nodes require less memory than a FAT"
explanations = ["Incorrect. Both allow random access effectively.", "Correct. An i-node only requires memory when the file is open, whereas a FAT for a large disk must be kept entirely in memory.", "Incorrect. Neither prevents external fragmentation.", "Incorrect. I-nodes occupy disk space for metadata."]

[[questions]]
question = "Which file system extension was specifically designed to add POSIX attributes (like file permissions) to the ISO 9660 standard?"
choices = ["Joliet", "Rock Ridge", "NTFS", "Ext2"]
answer = "Rock Ridge"
explanations = ["Incorrect. Joliet adds long file names and Unicode, not POSIX attributes.", "Correct. Rock Ridge extensions add POSIX file attributes to ISO 9660.", "Incorrect. NTFS is a Windows file system.", "Incorrect. Ext2 is a Linux file system."]

[[questions]]
question = "What is the fundamental difference between block devices and character devices?"
choices = ["Block devices are faster; character devices are slower", "Block devices store information in fixed-size blocks; character devices deliver/accept a stream of characters", "Block devices use DMA; character devices use interrupts", "Block devices are addressable; character devices use seek operations"]
answer = "Block devices store information in fixed-size blocks; character devices deliver/accept a stream of characters"
explanations = ["Incorrect. Speed is not the defining difference.", "Correct. Block devices use fixed-size blocks, while character devices handle streams without block structure.", "Incorrect. Both can use DMA or interrupts.", "Incorrect. Character devices are not addressable and do not have seek operations."]

[[questions]]
question = "Which of the following is a property of a 'precise interrupt'?"
choices = ["Multiple instructions beyond the PC have partially executed", "The PC is saved in a known place", "The execution state of the instruction pointed to by PC is unknown", "Interrupts are handled by user-space drivers"]
answer = "The PC is saved in a known place"
explanations = ["Incorrect. A precise interrupt guarantees no instructions beyond the PC have executed.", "Correct. A precise interrupt saves the PC in a known place and fully executes instructions before it.", "Incorrect. The execution state must be known.", "Incorrect. Interrupts are handled by the kernel."]

[[questions]]
question = "True or False: Programmed I/O requires the CPU to continuously poll the device to check if it is ready, which wastes CPU cycles."
choices = ["True", "False"]
answer = "True"
explanations = ["Correct. Programmed I/O uses busy waiting/polling, which ties up the CPU.", "Incorrect. This is exactly how programmed I/O works."]

[[questions]]
question = "Which disk arm scheduling algorithm moves the arm in one direction, servicing requests until it reaches the end, then reverses direction without servicing requests on the return trip (in the standard strict implementation)?"
choices = ["Shortest Seek First (SSF)", "Elevator algorithm (SCAN)", "First-Come, First-Served (FCFS)", "Circular SCAN (C-SCAN)"]
answer = "Elevator algorithm (SCAN)"
explanations = ["Incorrect. SSF goes to the closest request regardless of direction.", "Correct. The Elevator (SCAN) algorithm moves continuously in one direction servicing requests, then reverses.", "Incorrect. FCFS services in the order of arrival.", "Incorrect. C-SCAN only services in one direction and returns without servicing."]

[[questions]]
question = "In stable storage, what defines a 'Stable Write'?"
choices = ["Writing data to RAM and flushing to disk later", "Writing to one disk, and if successful, writing to the second disk", "Writing data simultaneously to both disks and verifying", "Writing data to disk and creating a backup tape"]
answer = "Writing to one disk, and if successful, writing to the second disk"
explanations = ["Incorrect. This is standard delayed write, not stable storage.", "Correct. A stable write writes to disk 1, verifies, then writes to disk 2 and verifies, handling crashes in between.", "Incorrect. The writes are sequential to handle crashes, not simultaneous.", "Incorrect. Tape backups are not part of stable storage."]

[[questions]]
question = "Which of the following is NOT one of the four conditions required for a resource deadlock?"
choices = ["Mutual exclusion", "Hold and wait", "Preemption", "Circular wait"]
answer = "Preemption"
explanations = ["Incorrect. Mutual exclusion is required.", "Incorrect. Hold and wait is required.", "Correct. The condition is 'No preemption', meaning resources cannot be taken away.", "Incorrect. Circular wait is required."]

[[questions]]
question = "In deadlock avoidance, what characterizes a 'Safe State'?"
choices = ["No deadlocks have occurred yet", "There exists a sequence of processes that can finish without deadlock", "All processes are blocked", "The system has enough resources for all processes simultaneously"]
answer = "There exists a sequence of processes that can finish without deadlock"
explanations = ["Incorrect. Deadlocks might still be possible in an unsafe state, but a safe state guarantees avoidance.", "Correct. A safe state means there is at least one order in which processes can execute to completion without running out of resources.", "Incorrect. This describes a deadlocked state.", "Incorrect. The system does not need to satisfy all processes at once, just sequence them."]

[[questions]]
question = "Which deadlock prevention strategy attacks the 'Circular Wait' condition?"
choices = ["Requesting all resources at once before execution", "Forcing processes to release resources if they cannot get new ones", "Numerically ordering resources and requiring processes to request them in order", "Ignoring the problem"]
answer = "Numerically ordering resources and requiring processes to request them in order"
explanations = ["Incorrect. This attacks 'Hold and wait'.", "Incorrect. This attacks 'No preemption'.", "Correct. Assigning numbers to resources and requiring requests in numerical order prevents cyclic dependencies.", "Incorrect. This is the Ostrich algorithm."]

[[questions]]
question = "What is the key difference between livelock and deadlock?"
choices = ["In livelock, processes are blocked; in deadlock, they are running", "In livelock, processes are not blocked but change state continuously without making progress; in deadlock, processes are blocked", "Deadlocks resolve automatically; livelocks require intervention", "Livelock only occurs in distributed systems; deadlock only in single-processor systems"]
answer = "In livelock, processes are not blocked but change state continuously without making progress; in deadlock, processes are blocked"
explanations = ["Incorrect. This is reversed.", "Correct. Livelocked processes are active and running but looping or reacting to each other without progress, whereas deadlocked processes are stuck waiting.", "Incorrect. Neither resolves automatically.", "Incorrect. Both can occur in various systems."]

[[questions]]
question = "Which of the following is a required dimension for a hypervisor to score well in virtualization?"
choices = ["Mobility", "Fidelity", "Scalability", "Persistence"]
answer = "Fidelity"
explanations = ["Incorrect. Mobility is not a core requirement for hypervisors.", "Correct. Fidelity ensures the program on the VM behaves identically to bare hardware.", "Incorrect. Scalability is good but not a core virtualization requirement like safety, fidelity, and efficiency.", "Incorrect. Persistence is not a core requirement."]

[[questions]]
question = "True or False: A Type 1 hypervisor runs directly on the bare metal, whereas a Type 2 hypervisor relies on a host operating system."
choices = ["True", "False"]
answer = "True"
explanations = ["Correct. Type 1 (bare-metal) runs on hardware, Type 2 (hosted) runs on an OS.", "Incorrect. This is the exact distinction between Type 1 and Type 2 hypervisors."]

[[questions]]
question = "In the context of virtualizing the x86 architecture, when is binary translation required?"
choices = ["When the virtual machine is running in user mode", "When the virtual machine can disable interrupts and issue I/O instructions", "When hardware virtualization support (VT-x/AMD-V) is present", "When the guest OS is open-source"]
answer = "When the virtual machine can disable interrupts and issue I/O instructions"
explanations = ["Incorrect. User mode instructions generally execute natively.", "Correct. If the VM executes privileged instructions like disabling interrupts or I/O, and hardware support isn't handling it, binary translation is needed to trap and emulate.", "Incorrect. Hardware support reduces the need for binary translation.", "Incorrect. The OS being open-source (like paravirtualization) is different from binary translation."]

[[questions]]
question = "Which characteristic of cloud computing refers to the ability to automatically provision resources without human interaction?"
choices = ["Broad network access", "Resource pooling", "On-demand self-service", "Rapid elasticity"]
answer = "On-demand self-service"
explanations = ["Incorrect. Broad network access means access over standard networks.", "Incorrect. Resource pooling is serving multiple consumers from a shared pool.", "Correct. On-demand self-service allows users to provision capabilities automatically.", "Incorrect. Rapid elasticity is scaling up and down quickly."]

[[questions]]
question = "Which multiprocessor architecture is characterized by having a single address space visible to all CPUs, but where access to remote memory is slower than access to local memory?"
choices = ["UMA (Uniform Memory Access)", "NUMA (Non-Uniform Memory Access)", "Message-Passing Multicomputer", "Wide Area Distributed System"]
answer = "NUMA (Non-Uniform Memory Access)"
explanations = ["Incorrect. UMA has equal access times for all memory.", "Correct. NUMA has a single address space but varying access times depending on memory proximity.", "Incorrect. Message-passing does not have a single shared address space.", "Incorrect. Distributed systems do not share a single address space."]

[[questions]]
question = "What is the primary purpose of 'Gang Scheduling' in multiprocessor systems?"
choices = ["To schedule processes based on their memory usage", "To ensure that related threads run simultaneously on different CPUs", "To prevent the CPU from overheating by alternating workloads", "To prioritize I/O-bound processes over CPU-bound processes"]
answer = "To ensure that related threads run simultaneously on different CPUs"
explanations = ["Incorrect. Gang scheduling is about timing, not memory.", "Correct. Gang scheduling schedules groups of related threads at the same time across different CPUs to minimize communication delays.", "Incorrect. This is thermal management, not scheduling.", "Incorrect. This is priority scheduling."]

[[questions]]
question = "In distributed shared memory (DSM), what is 'false sharing'?"
choices = ["Two processes trying to write to the same variable simultaneously", "Two unrelated variables residing on the same page, causing the page to ping-pong between machines", "A memory leak in a distributed node", "Accessing memory that has been revoked"]
answer = "Two unrelated variables residing on the same page, causing the page to ping-pong between machines"
explanations = ["Incorrect. This is a race condition.", "Correct. False sharing occurs when the page size granularity causes unrelated data to be transferred together, creating unnecessary network traffic.", "Incorrect. This is a software bug, not false sharing.", "Incorrect. This is an access violation."]

[[questions]]
question = "Which security model enforces the rule 'No read up, no write down'?"
choices = ["Biba Model", "Bell-LaPadula Model", "Clark-Wilson Model", "Brewer-Nash Model"]
answer = "Bell-LaPadula Model"
explanations = ["Incorrect. Biba enforces 'No read down, no write up'.", "Correct. Bell-LaPadula enforces the simple security property (no read up) and the * property (no write down) to ensure confidentiality.", "Incorrect. Clark-Wilson focuses on integrity via transaction separation.", "Incorrect. Brewer-Nash (Chinese Wall) prevents conflict of interest."]

[[questions]]
question = "In the Biba security model, which principle ensures data integrity by preventing processes from writing to objects at a higher security level?"
choices = ["The simple integrity principle", "The integrity * property", "The simple security property", "The invocation property"]
answer = "The integrity * property"
explanations = ["Incorrect. The simple integrity principle prevents reading down (no read down).", "Correct. The integrity * property prevents writing up (no write up).", "Incorrect. This is a Bell-LaPadula property.", "Incorrect. This is not a Biba model property."]

[[questions]]
question = "What is a covert channel in the context of computer security?"
choices = ["A hidden communication path that allows processes to transfer information in ways not intended by the system's security policy", "An encrypted tunnel between a client and server", "A physical wire tapping device", "A backdoor installed by a rootkit"]
answer = "A hidden communication path that allows processes to transfer information in ways not intended by the system's security policy"
explanations = ["Correct. Covert channels leak information by modulating shared resources (like CPU time or file locks) rather than using legitimate communication paths.", "Incorrect. This describes a VPN or SSH tunnel, not a covert channel.", "Incorrect. This is physical tampering.", "Incorrect. While a rootkit can facilitate it, a covert channel is specifically the method of unintended information transfer."]

[[questions]]
question = "Which of the following is an example of authentication based on 'something the user has'?"
choices = ["A password", "A fingerprint", "A smart card", "A PIN"]
answer = "A smart card"
explanations = ["Incorrect. A password is 'something the user knows'.", "Incorrect. A fingerprint is 'something the user is'.", "Correct. A smart card is a physical token the user possesses.", "Incorrect. A PIN is 'something the user knows'."]

[[questions]]
question = "What is the primary mechanism used by a stack canary to prevent buffer overflow attacks?"
choices = ["Encrypting the return address", "Placing a random value on the stack before the return address and checking it before returning", "Making the stack non-executable", "Limiting the size of local variables"]
answer = "Placing a random value on the stack before the return address and checking it before returning"
explanations = ["Incorrect. While encryption can help, this is not a stack canary.", "Correct. A canary is a known value placed between the buffer and the return address; if overwritten by a buffer overflow, the program aborts.", "Incorrect. This is the NX bit (DEP).", "Incorrect. This is not the mechanism of a canary."]

[[questions]]
question = "True or False: A hypervisor rootkit operates by modifying the operating system's user-space libraries."
choices = ["True", "False"]
answer = "False"
explanations = ["Incorrect. A library rootkit modifies user-space libraries.", "Correct. A hypervisor rootkit operates below the OS, creating a stealthy virtual machine layer."]

[[questions]]
question = "In Linux, which scheduling class is intended for tasks that require strict real-time execution and are scheduled on a First-In, First-Out basis without time slicing?"
choices = ["Timesharing", "Real-time round robin", "Real-time FIFO", "Completely Fair Scheduler (CFS)"]
answer = "Real-time FIFO"
explanations = ["Incorrect. Timesharing is for normal processes.", "Incorrect. Real-time round robin uses time slices.", "Correct. Real-time FIFO tasks run to completion or until blocked, without preemption by time slicing.", "Incorrect. CFS is the default scheduler for normal processes."]

[[questions]]
question = "Which memory zone in Linux is used for memory that the kernel can directly map to its virtual address space, typically found on 32-bit systems?"
choices = ["ZONE_DMA", "ZONE_NORMAL", "ZONE_HIGHMEM", "ZONE_KERNEL"]
answer = "ZONE_NORMAL"
explanations = ["Incorrect. ZONE_DMA is for legacy DMA operations.", "Correct. ZONE_NORMAL is directly mapped by the kernel.", "Incorrect. ZONE_HIGHMEM is memory not permanently mapped by the kernel.", "Incorrect. ZONE_KERNEL is not a standard Linux zone."]

[[questions]]
question = "In the Linux Ext2 file system, what is stored in an i-node?"
choices = ["File names", "Directory entries", "File attributes and pointers to data blocks", "The superblock"]
answer = "File attributes and pointers to data blocks"
explanations = ["Incorrect. File names are stored in directory entries, not i-nodes.", "Incorrect. Directory entries map names to i-nodes.", "Correct. The i-node contains metadata (attributes) and block pointers.", "Incorrect. The superblock contains file system-wide metadata."]

[[questions]]
question = "In Android's Binder IPC architecture, what is the role of the 'zygote' process?"
choices = ["It manages the screen brightness", "It acts as a global name service for Binder objects", "It is a pre-initialized process that forks to create new Android application processes quickly", "It handles garbage collection for Dalvik"]
answer = "It is a pre-initialized process that forks to create new application processes quickly"
explanations = ["Incorrect. This is handled by the system server.", "Incorrect. This is the role of the Service Manager.", "Correct. The zygote is pre-loaded with core libraries and forks to start new apps rapidly.", "Incorrect. Garbage collection is internal to the Dalvik VM."]

[[questions]]
question = "Which Android application component is primarily designed to perform long-running operations in the background without a user interface?"
choices = ["Activity", "Service", "Receiver", "Content Provider"]
answer = "Service"
explanations = ["Incorrect. An Activity provides a user interface.", "Correct. A Service runs in the background for tasks like music playback or network downloads.", "Incorrect. A Receiver responds to system-wide broadcast announcements.", "Incorrect. A Content Provider manages shared app data."]

[[questions]]
question = "In Windows, what is the primary function of the Hardware Abstraction Layer (HAL)?"
choices = ["To manage user logins and security tokens", "To hide hardware differences from the rest of the operating system", "To schedule threads on the CPU", "To manage the virtual file system cache"]
answer = "To hide hardware differences from the rest of the operating system"
explanations = ["Incorrect. This is handled by the security subsystem.", "Correct. The HAL provides a consistent interface to hardware for the kernel, executive, and drivers.", "Incorrect. This is handled by the kernel scheduler.", "Incorrect. This is handled by the Cache Manager."]

[[questions]]
question = "In Windows, what is an I/O Request Packet (IRP)?"
choices = ["A network packet sent to a remote server", "A data structure used to communicate I/O requests to device drivers", "An interrupt generated by a hardware device", "A packet containing memory page fault information"]
answer = "A data structure used to communicate I/O requests to device drivers"
explanations = ["Incorrect. IRPs are internal to the OS I/O system, not network packets.", "Correct. IRPs are passed down device stacks to instruct drivers on what I/O to perform.", "Incorrect. IRPs are not hardware interrupts.", "Incorrect. IRPs are for I/O, not page faults."]

[[questions]]
question = "How does the NTFS file system store small directories?"
choices = ["As a separate file on disk", "As an index inside the Master File Table (MFT) record", "As a linked list of blocks", "In the boot sector"]
answer = "As an index inside the Master File Table (MFT) record"
explanations = ["Incorrect. Large directories might use external structures, but small ones do not.", "Correct. For small directories, NTFS stores the directory index directly within the MFT record.", "Incorrect. This is an older file system technique.", "Incorrect. The boot sector contains boot code."]

[[questions]]
question = "Which Windows security feature ensures that newly allocated memory pages must be zeroed out before being mapped into a process's address space?"
choices = ["Address Space Layout Randomization (ASLR)", "Data Execution Prevention (DEP)", "Mandatory Integrity Control", "Zeroing pages before mapping"]
answer = "Zeroing pages before mapping"
explanations = ["Incorrect. ASLR randomizes memory locations.", "Incorrect. DEP prevents code execution from data pages.", "Incorrect. Mandatory Integrity Control assigns integrity levels.", "Correct. This prevents processes from reading leftover data (remnants) from previous processes."]

[[questions]]
question = "In operating system design, what is the primary trade-off considered in a 'Space-Time Trade-off'?"
choices = ["Between CPU speed and bus width", "Between memory usage and execution speed", "Between user space and kernel space", "Between security and performance"]
answer = "Between memory usage and execution speed"
explanations = ["Incorrect. This is hardware architecture.", "Correct. Using more memory (e.g., caching, lookup tables) can speed up execution, while compressing data saves space but costs CPU time.", "Incorrect. This is about privilege levels.", "Incorrect. While a factor, it is not the space-time trade-off."]

[[questions]]
question = "When looking up a file path like `/usr/ast/mbox`, why is an i-node cache critical for performance?"
choices = ["It caches the file data itself", "It prevents the need to read the file's contents from disk", "It avoids multiple disk reads for i-nodes and directories that have already been accessed", "It encrypts the path names"]
answer = "It avoids multiple disk reads for i-nodes and directories that have already been accessed"
explanations = ["Incorrect. The i-node cache stores metadata, not file data.", "Incorrect. It doesn't prevent reading file contents, but metadata.", "Correct. Without a cache, every path component requires disk reads for the directory and i-node.", "Incorrect. Caching is not about encryption."]

[[questions]]
question = "True or False: In Mills' proposal for a 10-person chief programmer team, the chief programmer does all the coding while the rest of the team supports them."
choices = ["True", "False"]
answer = "False"
explanations = ["Incorrect. The chief programmer designs and writes code, but they are supported by specialized roles like testers, editors, and administrators, not necessarily doing *all* the coding alone in a strict sense, but the proposal emphasizes a highly structured support system.", "Correct. The chief programmer is the lead, but the team includes roles like a backup programmer, programmers, and support staff to maximize efficiency."]

[[questions]]
question = "In the 11 steps of making a system call like `read(fd, buffer, nbytes)`, what triggers the actual transition from user mode to kernel mode?"
choices = ["A standard function call", "Executing a TRAP instruction", "A hardware interrupt from the disk", "A context switch initiated by the scheduler"]
answer = "Executing a TRAP instruction"
explanations = ["Incorrect. Standard function calls stay in the same privilege mode.", "Correct. The system call library procedure executes a TRAP instruction to switch to kernel mode and dispatch to the kernel.", "Incorrect. Hardware interrupts are asynchronous events, not triggered by the `read` call itself.", "Incorrect. The context switch happens as a result of the trap and subsequent kernel execution, not as the trigger."]

[[questions]]
question = "Which of the following best describes the concept of 'Ontogeny Recapitulates Phylogeny' in operating systems?"
choices = ["New OS features build directly on top of older ones", "Each new species of computer goes through the same development stages as its ancestors", "Software bugs reappear in successive generations of code", "Object-oriented programming inherited features from procedural programming"]
answer = "Each new species of computer goes through the same development stages as its ancestors"
