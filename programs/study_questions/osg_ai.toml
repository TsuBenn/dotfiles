explanations = ["Incorrect. FAT is an older file system, not the NTFS mechanism.", "Incorrect. I-nodes are used by UNIX/Linux file systems, not NTFS MFT records.", "Correct. NTFS uses MFT records containing attributes; small files can be 'resident' directly in the MFT record, while larger files use 'data runs' (logical cluster numbers and lengths).", "Incorrect. Extents are used by other file systems (like Ext4)."]

[[questions]]
question = "In Linux memory management, what is the function of the 'buddy system'?"
