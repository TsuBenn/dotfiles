choices = ["Biba", "Brewer-Nash", "Clark-Wilson", "Bell-LaPadula"]
answer = "Biba"
explanations = ["Correct. The Biba model focuses on integrity. The simple integrity principle prevents reading down (untrusted data), and the * property prevents writing up (corrupting high-integrity data).", "Incorrect. Brewer-Nash prevents conflict of interest.", "Incorrect. Clark-Wilson uses separation of duties.", "Incorrect. Bell-LaPadula enforces 'No read up, no write down' for confidentiality."]

[[questions]]
question = "In cryptography, what is a 'Digital Signature' used for?"
choices = ["To encrypt a message so only the recipient can read it", "To verify the identity of the sender and ensure the message was not altered", "To compress a file for transmission", "To hide the existence of a message"]
answer = "To verify the identity of the sender and ensure the message was not altered"
explanations = ["Incorrect. This is confidentiality (encryption).", "Correct. Digital signatures use the sender's private key to sign a hash of the message. The recipient uses the public key to verify authenticity and integrity.", "Incorrect. This is compression.", "Incorrect. This is steganography."]

[[questions]]
question = "Which type of attack involves chaining together small snippets of existing executable code (called 'gadgets') ending in `ret` instructions to perform malicious actions?"
choices = ["Buffer Overflow", "Return-Oriented Programming (ROP)", "Format String Attack", "SQL Injection"]
answer = "Return-Oriented Programming (ROP)"
explanations = ["Incorrect. Buffer overflow injects new code.", "Correct. ROP bypasses DEP/NX (Non-Executable) bits by reusing existing trusted code snippets ending in `ret` to execute desired logic.", "Incorrect. Format string attacks exploit `printf`-like functions.", "Incorrect. SQL injection targets databases."]

[[questions]]
question = "In Android, which component acts as a global name service for Binder objects, allowing processes to find system services?"
choices = ["Zygote", "Service Manager", "Activity Manager", "Dalvik VM"]
answer = "Service Manager"
explanations = ["Incorrect. Zygote forks new processes.", "Correct. The Service Manager acts as the context manager for Binder. System services register with it, and clients query it to get Binder proxies.", "Incorrect. Activity Manager manages app lifecycles.", "Incorrect. Dalvik executes bytecode."]

[[questions]]
question = "In the context of OS design, what is the 'Space-Time Trade-off'?"
choices = ["Trading memory usage for CPU speed (e.g., using a lookup table instead of calculating a value)", "Trading disk space for network bandwidth", "Trading user space for kernel space", "Trading security for performance"]
answer = "Trading memory usage for CPU speed (e.g., using a lookup table instead of calculating a value)"
explanations = ["Correct. Using more memory (space) to cache results or create lookup tables can significantly speed up execution (time), at the cost of higher memory footprint.", "Incorrect. This is not the standard definition.", "Incorrect. This is privilege level separation.", "Incorrect. While security can impact performance, this is not the space-time trade-off."]

[[questions]]
question = "Which of the following is NOT a typical layer of I/O software?"
choices = ["Interrupt Handlers", "Device Drivers", "Device-Independent I/O Software", "Compiler"]
answer = "Compiler"
explanations = ["Incorrect. Interrupt handlers are the lowest layer.", "Incorrect. Device drivers sit above interrupt handlers.", "Incorrect. Device-independent software (buffering, error reporting) sits above drivers.", "Correct. Compilers translate source code to machine code; they are not part of the runtime I/O system layers."]

[[questions]]
question = "What is the primary purpose of 'Jailing' in operating system security?"
choices = ["To encrypt user files", "To restrict a process to a specific subset of the file system tree, preventing escape", "To prevent CPU overheating", "To format disk drives"]
answer = "To restrict a process to a specific subset of the file system tree, preventing escape"
explanations = ["Incorrect. Jailing is not encryption.", "Correct. Jailing (like BSD jails or chroot) changes the root directory for a process, restricting its access to files outside that 'jail', isolating it.", "Incorrect. This is thermal management.", "Incorrect. This is unrelated to formatting."]
