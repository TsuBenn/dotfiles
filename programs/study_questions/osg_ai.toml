[[questions]]
question = "When a process grows in memory and requires more space, which memory management technique allows it to grow into an adjacent hole, or requires it to be moved to a larger hole or swapped out?"
choices = ["Bitmaps", "Base and Limit registers", "Swapping", "Paging"]
answer = "Swapping"
