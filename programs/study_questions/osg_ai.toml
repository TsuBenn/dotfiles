[[questions]]
question = "In the Readers and Writers problem, which synchronization scheme ensures that no writer is starved by a continuous stream of readers?"
choices = ["Writers are given higher priority than readers", "Readers are given higher priority than writers", "A FIFO queue is strictly maintained for all", "Writers use busy waiting instead of blocking"]
