[[questions]]
question = "In the Producer-Consumer problem using semaphores, what happens if the order of `down(&empty)` and `down(&mutex)` is reversed by the producer?"
choices = ["The system runs faster due to lock optimization", "A race condition occurs allowing data corruption", "A deadlock can occur if the buffer is full", "The mutex is bypassed entirely"]
