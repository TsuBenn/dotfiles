explanations = ["Incorrect. More RAM reduces thrashing.", "Incorrect. CPU cache size affects CPU-bound performance, not memory thrashing directly.", "Correct. Thrashing occurs when the system spends more time paging (swapping pages in and out) than executing code, caused by over-allocating memory or working sets exceeding physical RAM.", "Incorrect. Disk speed affects how fast thrashing happens, but doesn't cause it."]

[[questions]]
