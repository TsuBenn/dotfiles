explanations = ["Incorrect. It is only evicted if the R bit is 0.", "Correct. A set R bit means the page was recently used, so it is spared (given a second chance) by clearing the bit and moving it to the back.", "Incorrect. Writing to disk only happens if the Modified (M) bit is set upon eviction.", "Incorrect. The algorithm operates on existing pages, it doesn't trigger a fault itself."]

[[questions]]
