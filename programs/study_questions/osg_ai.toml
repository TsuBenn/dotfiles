choices = ["Its maximum resource needs", "Its CPU burst time", "Its memory page size", "Its network bandwidth"]
answer = "Its maximum resource needs"
explanations = ["Correct. The Banker's Algorithm requires each process to state its maximum resource demands so the system can determine if a state is 'safe' before granting requests.", "Incorrect. CPU burst times are for scheduling, not deadlock avoidance.", "Incorrect. Page sizes are hardware/OS configured.", "Incorrect. Network bandwidth is not relevant to the classic Banker's algorithm."]

[[questions]]
question = "Which of the following correctly defines a 'Safe State' in deadlock avoidance?"
